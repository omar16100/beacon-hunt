[project]
name = "beacon-hunt"
version = "0.1.0"
description = "Passive Bluetooth tools for finding a lost Apple device indoors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
