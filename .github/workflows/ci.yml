name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tests exercise pure logic (payload decoding, trilateration, the
    # dashboard tracker). None of them opens a Bluetooth scanner, and bleak only
    # loads its platform backend when a scanner is constructed, so Linux works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the release commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies from uv.lock
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
